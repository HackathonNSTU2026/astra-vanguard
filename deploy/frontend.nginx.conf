server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/(v1/|admin/(policy|journal)(/|$)) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location ~ ^/admin/?$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
