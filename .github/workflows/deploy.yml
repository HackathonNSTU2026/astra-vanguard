name: Deploy

on:
  push:
    branches: [main]
    paths: &deploy_paths
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths: *deploy_paths

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml

  backend:
    uses: ./.github/workflows/backend.yml

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Docker Compose
        run: docker compose -f deploy/compose.yml config --quiet

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, validate]
    runs-on: ubuntu-latest
    concurrency:
      group: astra-vanguard-deploy
      cancel-in-progress: false
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PATH: ${{ secrets.SERVER_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          : "${SERVER_PATH:?Set the SERVER_PATH secret}"
          staging=$(mktemp -d)
          git archive HEAD -- .dockerignore backend deploy frontend | tar -x -C "$staging"
          cd "$staging"
          rsync -az --relative --delete --protect-args \
            --exclude='.env*' \
            --exclude='/backend/data/' \
            --exclude='/backend/models/' \
            --exclude='/backend/temp/' \
            -e "ssh -o BatchMode=yes -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            .dockerignore backend/ deploy/ frontend/ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"

      - name: Deploy and verify services
        run: |
          printf -v remote_path '%q' "$SERVER_PATH"
          ssh -o BatchMode=yes -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" "bash -se -- $remote_path" <<'REMOTE'
          cd -- "$1"
          docker compose -f deploy/compose.yml up --build --wait --wait-timeout 120
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/admin
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/v1/adapter/received
          REMOTE
